name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift-format lint
        run: xcrun swift-format lint --strict -r Package.swift Sources scripts/make-icon.swift
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
      - name: ruff
        run: |
          uvx ruff format --check scripts e2e
          uvx ruff check scripts e2e
      - name: Build (release)
        run: swift build -c release
      - name: e2e (CLI + bundle; lock tests are local-only)
        run: uv run e2e/run.py
