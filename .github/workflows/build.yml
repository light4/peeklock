name: build

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow also runs for pull requests once the repo is public.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift-format lint
        run: xcrun swift-format lint --strict -r Package.swift Sources e2e scripts
      - name: Build (release)
        run: swift build -c release
      # Hosted macOS runners grant Accessibility, so the real-lock tests can run there
      # safely (disposable machine).
      - name: e2e (including real-lock tests)
        run: PEEKLOCK_E2E_LOCK=1 swift test
